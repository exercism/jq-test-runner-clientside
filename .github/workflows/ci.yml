name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Produces output/: the bundles, test-runner.tar, and the kernel
      # copied out of vendor/. bin/run-tests-in-container.mjs serves that
      # directory, so nothing runs before it exists.
      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Boots the kernel in headless Chrome and runs bats over tests/data,
      # inside it. The licence permits localhost.
      - name: Run tests in the container
        run: node bin/run-tests-in-container.mjs
